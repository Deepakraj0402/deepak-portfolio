<header class="navbar">
  <div class="container">
    <!-- Logo -->
    <a class="logo" href="#home"> Deepak<span>Raj</span> </a>

    <!-- Desktop Menu -->
    <nav class="desktop-menu">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#experience">Experience</a>
      <a href="#certifications">Certifications</a>
      <a href="#contact">Contact</a>
    </nav>

    <!-- Desktop Actions -->
    <div class="actions">
      <a class="resume-btn" href="resume/Deepakraj_Resume.pdf" download="Deepakraj_Resume.pdf">
        Resume
      </a>

      <a class="hire-btn" href="#contact"> Hire Me </a>
    </div>

    <!-- Mobile Menu Button -->
    <button
      class="menu-btn"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>

<!-- Mobile Navigation -->

@if (menuOpen()) {
  <nav class="mobile-menu">
    <a href="#home" (click)="closeMenu()">Home</a>

    <a href="#about" (click)="closeMenu()">About</a>

    <a href="#skills" (click)="closeMenu()">Skills</a>

    <a href="#projects" (click)="closeMenu()">Projects</a>

    <a href="#experience" (click)="closeMenu()">Experience</a>

    <a href="#certifications" (click)="closeMenu()"> Certifications </a>

    <a href="#contact" (click)="closeMenu()">Contact</a>

    <div class="mobile-actions">
      <a
        class="resume-btn"
        href="resume/Deepakraj_Resume.pdf"
        download="Deepakraj_Resume.pdf"
        (click)="closeMenu()"
      >
        Download Resume
      </a>

      <a class="hire-btn" href="#contact" (click)="closeMenu()"> Hire Me </a>
    </div>
  </nav>
}
