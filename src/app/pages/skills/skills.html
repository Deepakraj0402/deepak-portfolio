<section id="skills" class="skills">
  <div class="heading">
    <span class="header-light">MY SKILLS</span>

    <h2>Technologies I work with</h2>
  </div>

  <div class="skills-grid">
    <!-- Frontend -->

    <div class="skill-card">
      <h3>Frontend</h3>

      @for (skill of frontendSkills(); track skill) {
        <div class="skill-item">
          {{ skill }}
        </div>
      }
    </div>

    <!-- Tools -->

    <div class="skill-card">
      <h3>Tools</h3>

      @for (skill of tools(); track skill) {
        <div class="skill-item">
          {{ skill }}
        </div>
      }
    </div>
  </div>
</section>

<div
  _ngcontent-ng-c2984429617=""
  id="skills"
  class="align-items-center d-flex flex-column full-height"
>
  <section class="tech-banner">
    <div class="marquee">
      <div class="marquee-track">
        @for (skill of skillLogos; track skill.name) {
          <div class="tech-logo">
            <img [src]="skill.image" [alt]="skill.name" loading="lazy" />
          </div>
        }

        <!-- Duplicate for seamless infinite animation -->

        @for (skill of skillLogos; track 'duplicate-' + skill.name) {
          <div class="tech-logo">
            <img [src]="skill.image" [alt]="skill.name" loading="lazy" />
          </div>
        }
      </div>
    </div>
  </section>
</div>
